<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>// Хакерский вайбик //</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        :root {
            --neon-green: #0f0;
            --dark-bg: #0a0a0a;
            --darker-bg: #050505;
            --terminal-text: #00ff00;
            --glow: 0 0 10px var(--neon-green);
            --scanline: repeating-linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 255, 0, 0.05) 1px,
                transparent 2px
            );
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            min-height: 100vh;
            background-color: var(--dark-bg);
            background-image: 
                var(--scanline),
                radial-gradient(circle at 20% 30%, rgba(0, 255, 0, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 0, 0.02) 0%, transparent 50%);
            color: var(--terminal-text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                rgba(0, 255, 0, 0.03) 1px,
                transparent 1px
            );
            background-size: 100% 2px;
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--neon-green);
            border-radius: 0;
            box-shadow: var(--glow), 0 0 30px rgba(0, 255, 0, 0.3);
            overflow: hidden;
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        .container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg,
                rgba(0, 255, 0, 0.1) 0%,
                transparent 20%,
                transparent 80%,
                rgba(0, 255, 0, 0.1) 100%
            );
            pointer-events: none;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: normal;
            color: var(--neon-green);
            text-shadow: var(--glow);
            position: relative;
            letter-spacing: 2px;
        }

        h2::before, h2::after {
            content: "//";
            margin: 0 10px;
            opacity: 0.7;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: normal;
            color: var(--neon-green);
            text-shadow: var(--glow);
            letter-spacing: 1px;
        }

        input[type="file"],
        select {
            width: 100%;
            padding: 12px;
            border-radius: 0;
            border: 1px solid var(--neon-green);
            background: var(--darker-bg);
            color: var(--terminal-text);
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        input[type="file"]:focus,
        select:focus {
            outline: none;
            box-shadow: inset 0 0 15px rgba(0, 255, 0, 0.3), 0 0 15px rgba(0, 255, 0, 0.2);
            border-color: var(--neon-green);
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            padding: 12px 25px;
            border: 1px solid var(--neon-green);
            border-radius: 0;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            background: transparent;
            text-shadow: var(--glow);
            box-shadow: var(--glow);
        }

        button:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        button:active {
            background: rgba(0, 255, 0, 0.2);
        }

        button::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                transparent 0%,
                rgba(0, 255, 0, 0.1) 50%,
                transparent 100%
            );
            transform: rotate(30deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .result-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--neon-green);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-section h3 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--neon-green);
            text-shadow: var(--glow);
        }

        .download-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .download-link {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 0;
            text-decoration: none;
            color: var(--terminal-text);
            transition: all 0.3s ease;
            box-shadow: var(--glow);
            border: 1px solid var(--neon-green);
            text-shadow: var(--glow);
            letter-spacing: 1px;
        }

        .download-link:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .cipher-select {
            position: relative;
        }

        .cipher-select::after {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            color: var(--neon-green);
            pointer-events: none;
            text-shadow: var(--glow);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: var(--neon-green);
            animation: blink 1s step-end infinite;
            margin-left: 5px;
            vertical-align: middle;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .button-group {
                flex-direction: column;
                gap: 15px;
            }
            button {
                width: 100%;
            }
        }

        .binary-rain {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .binary-digit {
            position: absolute;
            color: rgba(0, 255, 0, 0.3);
            font-size: 16px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }
    </style>
</head>
<body>
    <div class="binary-rain" id="binaryRain"></div>
    
    <div class="container">
        <h2>ЗАГРУЗИТЕ ФАЙЛ ДЛЯ ШИФРОВАНИЯ<span class="cursor"></span></h2>
        <form method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">>> ФАЙЛ:</label>
                <input type="file" id="file" name="file" required>
            </div>
            
            <div class="form-group">
                <label for="keyfile">>> ФАЙЛ КЛЮЧА (ТОЛЬКО ДЛЯ РАСШИФРОВКИ):</label>
                <input type="file" id="keyfile" name="keyfile">
            </div>
            
            <div class="form-group cipher-select">
                <label for="cipher">>> ВЫБЕРИТЕ ШИФР:</label>
                <select id="cipher" name="cipher" required>
                    {% for c in ciphers %}
                        <option value="{{c}}">{{c.upper()}}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="button-group">
                <button type="submit" name="action" value="encrypt">ЗАШИФРОВАТЬ</button>
                <button type="submit" name="action" value="decrypt">РАСШИФРОВАТЬ</button>
            </div>
        </form>

        {% if result %}
            <div class="result-section">
                <h3>> СКАЧАТЬ ФАЙЛЫ:</h3>
                <div class="download-links">
                    {% if result.enc %}
                        <a class="download-link" href="{{ url_for('download_file', filename=result.enc) }}">>> ШИФРОФАЙЛ</a>
                    {% endif %}
                    {% if result.key %}
                        <a class="download-link" href="{{ url_for('download_file', filename=result.key) }}">>> КЛЮЧ</a>
                    {% endif %}
                    {% if result.dec %}
                        <a class="download-link" href="{{ url_for('download_file', filename=result.dec) }}">>> РАСШИФРОВАННЫЙ ФАЙЛ</a>
                    {% endif %}
                </div>
            </div>
        {% endif %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const binaryRain = document.getElementById('binaryRain');
            const digits = '01';
            const count = Math.floor(window.innerWidth / 20);
            
            for (let i = 0; i < count; i++) {
                createBinaryStream(i);
            }
            
            function createBinaryStream(index) {
                const delay = Math.random() * 5;
                const duration = 5 + Math.random() * 10;
                const left = (index / count) * 100;
                
                const element = document.createElement('div');
                element.className = 'binary-digit';
                element.style.left = `${left}%`;
                element.style.animationDelay = `${delay}s`;
                element.style.animationDuration = `${duration}s`;
                
                let content = '';
                const length = 10 + Math.floor(Math.random() * 20);
                for (let i = 0; i < length; i++) {
                    content += digits.charAt(Math.floor(Math.random() * digits.length)) + '<br>';
                }
                
                element.innerHTML = content;
                binaryRain.appendChild(element);
                
                element.addEventListener('animationiteration', function() {
                    element.style.top = `-${length * 20}px`;
                });
            }
        });
    </script>
</body>
</html>
